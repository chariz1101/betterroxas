<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0032a0" />
    <title>Offline - BetterRoxas</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--gray-50);
        color: var(--gray-900);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }
      .skip-link {
        position: absolute;
        top: -100%;
        left: 0;
        padding: 0.5rem 1rem;
        background: var(--color-primary);
        color: var(--color-white);
        z-index: 100;
      }
      .skip-link:focus {
        top: 0;
      }
      .container {
        max-width: 600px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 180px;
        height: auto;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        color: var(--color-primary);
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: var(--gray-700);
        margin-bottom: 2rem;
        line-height: 1.5;
      }
      .hotlines {
        background: var(--color-white);
        border: 1px solid var(--gray-200);
        border-radius: var(--radius-md);
        padding: 1.5rem;
        margin-bottom: 2rem;
        text-align: left;
      }
      .hotlines h2 {
        font-size: 1.1rem;
        color: var(--color-primary);
        margin-bottom: 1rem;
        text-align: center;
      }
      .hotline-list {
        list-style: none;
      }
      .hotline-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.6rem 0;
        border-bottom: 1px solid var(--gray-200);
      }
      .hotline-list li:last-child {
        border-bottom: none;
      }
      .hotline-label {
        font-weight: 600;
        color: var(--gray-900);
      }
      .hotline-number {
        color: var(--color-primary);
        font-weight: 600;
        text-decoration: none;
      }
      .hotline-number:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
      .retry-btn {
        display: inline-block;
        background: var(--color-primary);
        color: var(--color-white);
        border: none;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        border-radius: var(--radius-sm);
        cursor: pointer;
        text-decoration: none;
      }
      .retry-btn:hover {
        background: var(--color-primary-dark);
      }
      .retry-btn:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
      @media (max-width: 480px) {
        .hotline-list li {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.25rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link" data-i18n="offline-skip-to-main-content"
      >Skip to main content</a
    >

    <main id="main-content" class="container" role="main">
      <svg class="logo" viewBox="0 0 200 60" aria-label="BetterRoxas" role="img">
        <rect width="200" height="60" rx="8" fill="#0032a0" />
        <text
          x="100"
          y="36"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Inter, sans-serif"
          font-size="18"
          font-weight="700"
        >
          BetterRoxas
        </text>
      </svg>

      <h1 data-i18n="offline-you-are-currently-offline">You are currently offline</h1>
      <p class="subtitle" data-i18n="offline-some-pages-may-not-be-available-right-now">
        Some pages may not be available right now. Emergency hotlines are listed below for your
        convenience.
      </p>

      <div class="hotlines">
        <h2 data-i18n="offline-emergency-hotlines-roxas-capiz">
          Emergency Hotlines - Roxas City, Capiz
        </h2>
        <ul class="hotline-list" aria-label="Emergency contact numbers">
          <li>
            <span class="hotline-label">Emergency</span>
            <a href="tel:911" class="hotline-number">911</a>
          </li>
          <li>
            <span class="hotline-label">City CERT</span>
            <a href="tel:0365227878" class="hotline-number">(036) 522-7878</a>
          </li>
          <li>
            <span class="hotline-label">CERT Mobile</span>
            <a href="tel:09173066741" class="hotline-number">0917 306 6741</a>
          </li>
          <li>
            <span class="hotline-label" data-i18n="offline-municipal-hall">City Hall</span>
            <a href="tel:0366212049" class="hotline-number">(036) 6212-049</a>
          </li>
        </ul>
      </div>

      <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
